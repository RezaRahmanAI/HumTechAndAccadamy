<nav class="sticky top-0 z-50 border-b border-slate-200 bg-white/90 backdrop-blur">
  <div class="mx-auto flex max-w-7xl items-center justify-between px-6 py-4">
    <a routerLink="/" class="flex items-center gap-2 text-xl font-bold text-blue-900">
      <span class="h-10 w-10 rounded-lg bg-gradient-to-br from-blue-600 to-cyan-500"></span>
      VivaSphere
    </a>
    <div class="hidden items-center gap-8 lg:flex">
      <div class="relative" (mouseenter)="isServicesOpen = true" (mouseleave)="isServicesOpen = false">
        <button class="flex items-center gap-1 text-sm font-semibold text-slate-700 hover:text-blue-600">
          Services
          <span class="material-symbols-outlined text-base">expand_more</span>
        </button>
        <div
          class="absolute left-0 mt-3 w-72 rounded-2xl border border-slate-200 bg-white p-4 shadow-lg"
          *ngIf="isServicesOpen"
        >
          <a
            *ngFor="let item of navItems[0].children"
            [routerLink]="item.path"
            class="block rounded-xl px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 hover:text-blue-600"
            (click)="isServicesOpen = false"
            >{{ item.label }}</a
          >
        </div>
      </div>
      <a
        [routerLink]="navItems[1].path"
        [fragment]="navItems[1].fragment"
        class="text-sm font-semibold text-slate-700 hover:text-blue-600"
        >Technologies</a
      >
      <div class="relative" (mouseenter)="isHiringOpen = true" (mouseleave)="isHiringOpen = false">
        <button class="flex items-center gap-1 text-sm font-semibold text-slate-700 hover:text-blue-600">
          For Hiring
          <span class="material-symbols-outlined text-base">expand_more</span>
        </button>
        <div
          class="absolute left-0 mt-3 w-72 rounded-2xl border border-slate-200 bg-white p-4 shadow-lg"
          *ngIf="isHiringOpen"
        >
          <a
            *ngFor="let item of navItems[2].children"
            [routerLink]="item.path"
            class="block rounded-xl px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 hover:text-blue-600"
            (click)="isHiringOpen = false"
            >{{ item.label }}</a
          >
        </div>
      </div>
      <a routerLink="/mvp-calculator" class="text-sm font-semibold text-slate-700 hover:text-blue-600">MVP Calculator</a>
      <a
        href="https://example.com/academy"
        target="_blank"
        rel="noopener noreferrer"
        class="text-sm font-semibold text-slate-700 hover:text-blue-600"
        >Academy</a
      >
      <a routerLink="/blog" class="text-sm font-semibold text-slate-700 hover:text-blue-600">Blog</a>
      <a routerLink="/contact" class="text-sm font-semibold text-slate-700 hover:text-blue-600">Contact</a>
    </div>
    <div class="hidden lg:block">
      <a
        href="https://calendly.com/vivasphere/intro-call"
        target="_blank"
        rel="noopener noreferrer"
        class="rounded-full bg-gradient-to-r from-blue-600 to-cyan-500 px-5 py-2 text-sm font-semibold text-white shadow-lg transition hover:shadow-xl"
        >Schedule a Call</a
      >
    </div>
    <button class="lg:hidden" type="button" (click)="toggleMobileMenu()">
      <span class="material-symbols-outlined text-3xl text-slate-800">menu</span>
    </button>
  </div>
  <div class="lg:hidden" *ngIf="isMobileMenuOpen">
    <div class="space-y-4 border-t border-slate-200 bg-white px-6 py-6">
      <div>
        <button
          type="button"
          class="flex w-full items-center justify-between text-left text-sm font-semibold text-slate-700"
          (click)="toggleMobileSection('services')"
        >
          Services
          <span class="material-symbols-outlined text-base">{{ mobileServicesOpen ? 'expand_less' : 'expand_more' }}</span>
        </button>
        <div class="mt-2 space-y-2" *ngIf="mobileServicesOpen">
          <a
            *ngFor="let item of navItems[0].children"
            [routerLink]="item.path"
            (click)="closeMobileMenu()"
            class="block rounded-xl bg-slate-100 px-4 py-3 text-sm font-semibold text-slate-700"
            >{{ item.label }}</a
          >
        </div>
      </div>
      <div>
        <button
          type="button"
          class="flex w-full items-center justify-between text-left text-sm font-semibold text-slate-700"
          (click)="toggleMobileSection('hiring')"
        >
          For Hiring
          <span class="material-symbols-outlined text-base">{{ mobileHiringOpen ? 'expand_less' : 'expand_more' }}</span>
        </button>
        <div class="mt-2 space-y-2" *ngIf="mobileHiringOpen">
          <a
            *ngFor="let item of navItems[2].children"
            [routerLink]="item.path"
            (click)="closeMobileMenu()"
            class="block rounded-xl bg-slate-100 px-4 py-3 text-sm font-semibold text-slate-700"
            >{{ item.label }}</a
          >
        </div>
      </div>
      <a
        [routerLink]="navItems[1].path"
        [fragment]="navItems[1].fragment"
        class="block text-sm font-semibold text-slate-700"
        (click)="closeMobileMenu()"
        >Technologies</a
      >
      <a routerLink="/mvp-calculator" class="block text-sm font-semibold text-slate-700" (click)="closeMobileMenu()"
        >MVP Calculator</a
      >
      <a href="https://example.com/academy" target="_blank" rel="noopener noreferrer" class="block text-sm font-semibold text-slate-700"
        >Academy</a
      >
      <a routerLink="/blog" class="block text-sm font-semibold text-slate-700" (click)="closeMobileMenu()">Blog</a>
      <a routerLink="/contact" class="block text-sm font-semibold text-slate-700" (click)="closeMobileMenu()"
        >Contact</a
      >
      <a
        href="https://calendly.com/vivasphere/intro-call"
        target="_blank"
        rel="noopener noreferrer"
        class="block rounded-full bg-gradient-to-r from-blue-600 to-cyan-500 px-5 py-3 text-center text-sm font-semibold text-white"
        (click)="closeMobileMenu()"
        >Schedule a Call</a
      >
    </div>
  </div>
</nav>

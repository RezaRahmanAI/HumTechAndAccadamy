<ng-container *ngIf="product$ | async as product">
  <section class="bg-slate-900 py-24 text-white">
    <div class="mx-auto max-w-5xl px-6 text-center">
      <p class="text-sm font-semibold uppercase tracking-[0.3em] text-cyan-300">{{ product.industry }}</p>
      <h1 class="mt-4 text-4xl font-bold">{{ product.name }}</h1>
      <p class="mt-4 text-lg text-slate-300">{{ product.shortDescription }}</p>
    </div>
  </section>
  <section class="bg-white py-20">
    <div class="mx-auto max-w-6xl px-6 space-y-12">
      <article class="grid gap-8 lg:grid-cols-2">
        <div class="space-y-6">
          <h2 class="text-2xl font-semibold text-slate-900">Overview</h2>
          <p class="text-base leading-7 text-slate-600">{{ product.longDescription }}</p>
        </div>
        <div class="rounded-3xl bg-slate-50 p-8">
          <h3 class="text-xl font-semibold text-slate-900">Key Metrics</h3>
          <ul class="mt-4 space-y-3 text-sm text-slate-600">
            <li *ngFor="let metric of product.metrics">• {{ metric }}</li>
          </ul>
        </div>
      </article>
      <article class="grid gap-8 lg:grid-cols-2">
        <div class="rounded-3xl border border-slate-200 bg-white p-8 shadow-sm">
          <h3 class="text-xl font-semibold text-slate-900">Tech Stack Used</h3>
          <div class="mt-4 flex flex-wrap gap-3">
            <span *ngFor="let tech of product.techStack" class="rounded-full bg-blue-50 px-4 py-2 text-sm text-blue-700">
              {{ tech }}
            </span>
          </div>
        </div>
        <div class="rounded-3xl bg-blue-50 p-8">
          <h3 class="text-xl font-semibold text-blue-900">Results</h3>
          <p class="mt-4 text-sm text-blue-900">
            {{ product.longDescription }}
          </p>
        </div>
      </article>
      <div class="flex justify-center">
        <a
          routerLink="/contact"
          class="rounded-full bg-gradient-to-r from-blue-600 to-cyan-500 px-6 py-3 text-sm font-semibold text-white shadow-lg transition hover:shadow-xl"
          >Discuss a similar build →</a
        >
      </div>
    </div>
  </section>
</ng-container>

<section class="bg-slate-900 py-24 text-white">
  <div class="mx-auto max-w-6xl px-6 text-center">
    <p class="text-sm font-semibold uppercase tracking-[0.3em] text-cyan-300">Our expertise</p>
    <h1 class="mt-4 text-4xl font-bold">Services engineered to accelerate your roadmap</h1>
    <p class="mt-4 text-lg text-slate-300">
      Pair with dedicated squads who bring architectural clarity, transparent delivery, and a focus on outcomes.
    </p>
  </div>
</section>
<section class="bg-white py-20">
  <div class="mx-auto max-w-7xl px-6">
    <div class="grid gap-6 md:grid-cols-2 xl:grid-cols-3">
      <a
        *ngFor="let service of services$ | async"
        [routerLink]="['/services', service.slug]"
        class="group flex h-full flex-col gap-4 rounded-3xl border border-slate-200 bg-slate-50/80 p-6 transition hover:-translate-y-1 hover:border-blue-200 hover:bg-white hover:shadow-xl"
      >
        <div class="flex h-12 w-12 items-center justify-center rounded-2xl bg-blue-100 text-blue-600">
          <span class="text-xl">{{ service.icon }}</span>
        </div>
        <h3 class="text-xl font-semibold text-slate-900">{{ service.title }}</h3>
        <p class="text-sm text-slate-600">{{ service.subtitle }}</p>
        <span class="mt-auto text-sm font-semibold text-blue-600">Explore →</span>
      </a>
    </div>
  </div>
</section>

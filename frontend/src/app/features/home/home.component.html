<div class="relative">
  <div class="absolute inset-x-0 top-0 h-[500px] bg-gradient-to-b from-blue-50/80 to-transparent"></div>
  <ng-container *ngIf="content$ | async as content">
    <app-hero [hero]="content.hero"></app-hero>
    <app-trusted-by [section]="content.trustedBy"></app-trusted-by>
    <app-collaboration-models [models]="content.collaborationModels"></app-collaboration-models>
    <app-services-grid [services]="content.services"></app-services-grid>
    <app-products-showcase [featured]="content.featuredProducts" [spotlights]="content.productSpotlights"></app-products-showcase>
    <app-tech-stack-marquee [section]="content.techStack"></app-tech-stack-marquee>
    <app-testimonials [section]="content.testimonials"></app-testimonials>
    <app-industries-grid [section]="content.industries"></app-industries-grid>
    <app-excellence [section]="content.excellence"></app-excellence>
    <app-why-choose-us [items]="content.whyChooseUs"></app-why-choose-us>
    <app-team-showcase [members]="content.teamMembers"></app-team-showcase>
    <app-process-timeline [section]="content.process"></app-process-timeline>
    <app-faq-accordion [items]="content.faqs"></app-faq-accordion>
    <app-blog-preview [posts]="content.recentBlogs"></app-blog-preview>
    <app-final-cta [content]="content.finalCta"></app-final-cta>
  </ng-container>
  <div *ngIf="loading" class="flex items-center justify-center py-32">
    <div class="h-12 w-12 animate-spin rounded-full border-4 border-blue-200 border-t-blue-600"></div>
  </div>
</div>

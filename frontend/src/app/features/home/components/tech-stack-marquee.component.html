<section class="bg-white py-20" id="tech-stack">
  <div class="mx-auto max-w-7xl px-6">
    <p class="text-center text-xs font-semibold uppercase tracking-[0.4em] text-slate-500">{{ section.title }}</p>
    <p class="mt-3 text-center text-sm text-slate-600">{{ section.description }}</p>
    <div class="relative mt-12 overflow-hidden">
      <div class="flex animate-marquee gap-12 whitespace-nowrap">
        <div *ngFor="let logo of section.logos" class="flex items-center gap-3 rounded-full bg-slate-100 px-6 py-3 text-sm">
          <span class="h-3 w-3 rounded-full bg-blue-500"></span>
          <span class="font-medium text-slate-600">{{ logo.name }}</span>
        </div>
      </div>
      <div class="absolute inset-y-0 right-0 w-12 bg-gradient-to-l from-white"></div>
      <div class="absolute inset-y-0 left-0 w-12 bg-gradient-to-r from-white"></div>
    </div>
  </div>
</section>

<section class="bg-white py-20">
  <div class="mx-auto max-w-7xl px-6">
    <div class="max-w-2xl">
      <p class="text-sm font-semibold uppercase tracking-wide text-blue-500">Why teams partner with VivaSphere</p>
      <h2 class="mt-4 text-3xl font-bold text-slate-900 sm:text-4xl">Journey with us for craftsmanship and accountability</h2>
      <p class="mt-4 text-lg text-slate-600">
        Every engagement blends leadership, engineering rigor, and transparent communication so you stay focused on
        outcomes.
      </p>
    </div>
    <div class="mt-12 grid gap-6 sm:grid-cols-2">
      <div
        *ngFor="let item of items"
        class="flex h-full flex-col gap-3 rounded-3xl border border-slate-200 bg-slate-50 p-6 transition hover:-translate-y-1 hover:border-blue-200 hover:bg-white"
      >
        <span class="text-3xl">{{ item.icon }}</span>
        <h3 class="text-xl font-semibold text-slate-900">{{ item.title }}</h3>
        <p class="text-sm text-slate-600">{{ item.description }}</p>
      </div>
    </div>
  </div>
</section>

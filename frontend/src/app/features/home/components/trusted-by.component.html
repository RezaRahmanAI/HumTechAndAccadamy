<section class="bg-white py-16">
  <div class="mx-auto max-w-7xl px-6">
    <p class="text-center text-sm font-semibold uppercase tracking-[0.3em] text-slate-500">
      Leading teams rely on VivaSphere engineers
    </p>
    <div class="mt-10 grid grid-cols-2 gap-6 sm:grid-cols-4 lg:grid-cols-6">
      <div
        *ngFor="let logo of logos"
        class="flex items-center justify-center rounded-2xl border border-slate-200 bg-slate-50 px-6 py-4 text-sm font-semibold text-slate-500"
      >
        {{ logo }}
      </div>
    </div>
  </div>
</section>

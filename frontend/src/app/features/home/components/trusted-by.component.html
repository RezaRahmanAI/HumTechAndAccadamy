<section class="bg-white py-16">
  <div class="mx-auto max-w-7xl px-6">
    <p class="text-center text-xs font-semibold uppercase tracking-[0.4em] text-slate-500">{{ section.eyebrow }}</p>
    <h3 class="mt-4 text-center text-lg font-semibold text-slate-700">{{ section.description }}</h3>
    <div class="mt-10 grid grid-cols-2 gap-6 sm:grid-cols-4 lg:grid-cols-5">
      <div
        *ngFor="let logo of section.logos"
        class="flex items-center justify-center rounded-2xl border border-slate-200 bg-slate-50 px-6 py-4 text-sm font-semibold text-slate-500"
      >
        {{ logo }}
      </div>
    </div>
  </div>
</section>

<section class="relative overflow-hidden py-24">
  <div class="absolute inset-0 bg-gradient-to-r from-blue-700 via-blue-500 to-cyan-500"></div>
  <div class="relative mx-auto max-w-5xl rounded-[3rem] bg-white/5 p-16 text-center text-white shadow-2xl backdrop-blur">
    <p class="text-sm font-semibold uppercase tracking-[0.3em] text-cyan-200">{{ content.eyebrow }}</p>
    <h2 class="mt-6 text-4xl font-bold">{{ content.title }}</h2>
    <p class="mt-4 text-lg text-blue-100">{{ content.description }}</p>
    <div class="mt-8 flex flex-col items-center justify-center gap-4 sm:flex-row">
      <a
        [routerLink]="content.primaryCtaLink"
        class="rounded-full bg-white px-6 py-3 text-sm font-semibold text-blue-700 shadow-lg transition hover:bg-blue-50"
        >{{ content.primaryCtaLabel }}</a
      >
      <a
        [routerLink]="content.secondaryCtaLink"
        class="rounded-full border border-white/60 px-6 py-3 text-sm font-semibold text-white transition hover:bg-white/10"
        >{{ content.secondaryCtaLabel }}</a
      >
    </div>
  </div>
</section>

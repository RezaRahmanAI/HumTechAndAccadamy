<section class="bg-white py-20">
  <div class="mx-auto max-w-7xl px-6">
    <div class="max-w-2xl">
      <p class="text-sm font-semibold uppercase tracking-wide text-blue-500">{{ section.eyebrow }}</p>
      <h2 class="mt-4 text-3xl font-bold text-slate-900 sm:text-4xl">{{ section.title }}</h2>
      <p class="mt-4 text-lg text-slate-600">{{ section.description }}</p>
    </div>
    <div class="mt-12 grid gap-4 sm:grid-cols-2 lg:grid-cols-4">
      <div
        *ngFor="let industry of section.items"
        class="rounded-3xl border border-slate-200 bg-slate-50 p-6 text-center text-sm font-semibold text-slate-700 transition hover:-translate-y-1 hover:border-blue-200 hover:bg-white"
      >
        <span class="block text-2xl">{{ industry.icon }}</span>
        <span class="mt-2 block">{{ industry.name }}</span>
      </div>
    </div>
  </div>
</section>

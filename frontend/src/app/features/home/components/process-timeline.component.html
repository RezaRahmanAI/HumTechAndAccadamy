<section class="bg-white py-20">
  <div class="mx-auto max-w-7xl px-6">
    <div class="max-w-2xl">
      <p class="text-sm font-semibold uppercase tracking-wide text-blue-500">{{ section.eyebrow }}</p>
      <h2 class="mt-4 text-3xl font-bold text-slate-900 sm:text-4xl">{{ section.title }}</h2>
      <p class="mt-4 text-lg text-slate-600">{{ section.description }}</p>
    </div>
    <div class="mt-12 grid gap-8 lg:grid-cols-4">
      <div
        *ngFor="let step of section.steps"
        class="relative flex flex-col gap-4 rounded-3xl border border-slate-200 bg-slate-50 p-6 text-slate-700"
      >
        <span class="inline-flex h-10 w-10 items-center justify-center rounded-full bg-blue-600 text-sm font-semibold text-white">
          {{ step.step }}
        </span>
        <h3 class="text-lg font-semibold text-slate-900">{{ step.title }}</h3>
        <p class="text-sm text-slate-600">{{ step.description }}</p>
      </div>
    </div>
    <div class="mt-12">
      <a
        class="inline-flex items-center justify-center rounded-full bg-gradient-to-r from-blue-600 to-cyan-500 px-6 py-3 text-sm font-semibold text-white shadow-lg transition hover:shadow-xl"
        [href]="section.cta.url"
      >
        {{ section.cta.label }}
      </a>
    </div>
  </div>
</section>

<section class="bg-slate-900 py-20 text-white">
  <div class="mx-auto max-w-7xl px-6">
    <div class="flex flex-col gap-6 lg:flex-row lg:items-end lg:justify-between">
      <div class="max-w-xl">
        <p class="text-sm font-semibold uppercase tracking-wide text-cyan-300">Products & case studies</p>
        <h2 class="mt-4 text-3xl font-bold sm:text-4xl">Software crafted to handle millions of users</h2>
        <p class="mt-4 text-lg text-slate-300">
          Explore the platforms we engineered for fintechs, marketplaces, and media companies to scale globally.
        </p>
      </div>
      <a
        routerLink="/products"
        class="inline-flex items-center gap-2 rounded-full border border-white/30 px-5 py-2 text-sm font-semibold text-white transition hover:border-white hover:bg-white/10"
        >View all case studies →</a
      >
    </div>
    <div class="mt-12 grid gap-6 lg:grid-cols-3">
      <a
        *ngFor="let product of products"
        [routerLink]="['/products', product.slug]"
        class="group flex h-full flex-col gap-4 rounded-3xl bg-white/5 p-6 backdrop-blur transition hover:-translate-y-1 hover:bg-white/10"
      >
        <div class="flex items-center justify-between">
          <p class="text-sm uppercase tracking-wide text-cyan-300">{{ product.industry }}</p>
          <span class="text-sm text-cyan-200">View →</span>
        </div>
        <h3 class="text-2xl font-semibold">{{ product.name }}</h3>
        <p class="text-sm text-slate-200">{{ product.shortDescription }}</p>
        <div class="mt-auto grid gap-2 text-xs text-slate-300">
          <span *ngFor="let metric of product.metrics">• {{ metric }}</span>
        </div>
      </a>
    </div>
  </div>
</section>

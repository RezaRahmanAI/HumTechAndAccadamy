<ng-container *ngIf="post$ | async as post">
  <section class="bg-slate-900 py-24 text-white">
    <div class="mx-auto max-w-3xl px-6">
      <a routerLink="/blog" class="text-sm text-cyan-300">← Back to all posts</a>
      <p class="mt-6 text-sm uppercase tracking-[0.3em] text-cyan-300">{{ post.category }}</p>
      <h1 class="mt-4 text-4xl font-bold">{{ post.title }}</h1>
      <p class="mt-4 text-sm text-slate-300">Published {{ post.publishedAt | date }} · 8 min read</p>
    </div>
  </section>
  <section class="bg-white py-20">
    <div class="prose prose-lg mx-auto max-w-3xl px-6 text-slate-700">
      <p>{{ post.body }}</p>
    </div>
  </section>
</ng-container>

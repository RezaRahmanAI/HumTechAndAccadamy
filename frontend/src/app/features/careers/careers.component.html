<section class="bg-slate-900 py-24 text-white">
  <div class="mx-auto max-w-5xl px-6 text-center">
    <p class="text-sm font-semibold uppercase tracking-[0.3em] text-cyan-300">Careers</p>
    <h1 class="mt-4 text-4xl font-bold">Join a team that solves global problems</h1>
    <p class="mt-4 text-lg text-slate-300">
      Work alongside specialists crafting resilient software for ambitious companies worldwide.
    </p>
  </div>
</section>
<section class="bg-white py-20">
  <div class="mx-auto max-w-6xl px-6 space-y-6" *ngIf="jobs$ | async as jobs">
    <a
      *ngFor="let job of jobs"
      [routerLink]="['/career', job.slug]"
      class="flex flex-col gap-3 rounded-3xl border border-slate-200 bg-slate-50/80 p-6 transition hover:-translate-y-1 hover:border-blue-200 hover:bg-white hover:shadow-xl"
    >
      <div class="flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between">
        <h3 class="text-xl font-semibold text-slate-900">{{ job.title }}</h3>
        <span class="rounded-full bg-blue-100 px-4 py-1 text-xs font-semibold uppercase tracking-wide text-blue-700">
          {{ job.department }}
        </span>
      </div>
      <p class="text-sm text-slate-600">{{ job.location }} · {{ job.employmentType }}</p>
      <p class="text-sm text-slate-500">Posted {{ job.postedAt | date }}</p>
    </a>
  </div>
</section>
